[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-calculator"
version = "0.1.0"
description = "Remote Calculator MCP Server for Render"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.scripts]
start-calculator = "mcp_calculator.server:main"